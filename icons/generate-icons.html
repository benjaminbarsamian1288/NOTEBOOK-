<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>Right-click each icon and "Save Image As" with the correct filename:</p>
<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
sizes.forEach(size => {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#4a90d9');
    grad.addColorStop(1, '#357abd');
    ctx.fillStyle = grad;

    // Rounded rect
    const r = size * 0.15;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    // Book icon
    ctx.fillStyle = 'white';
    const cx = size / 2;
    const cy = size / 2;
    const s = size * 0.25;

    // Left page
    ctx.beginPath();
    ctx.moveTo(cx, cy - s * 0.9);
    ctx.lineTo(cx - s * 1.1, cy - s * 0.7);
    ctx.lineTo(cx - s * 1.1, cy + s * 0.9);
    ctx.lineTo(cx, cy + s * 0.7);
    ctx.closePath();
    ctx.fill();

    // Right page
    ctx.beginPath();
    ctx.moveTo(cx, cy - s * 0.9);
    ctx.lineTo(cx + s * 1.1, cy - s * 0.7);
    ctx.lineTo(cx + s * 1.1, cy + s * 0.9);
    ctx.lineTo(cx, cy + s * 0.7);
    ctx.closePath();
    ctx.fill();

    // Mic circle
    ctx.fillStyle = '#e74c3c';
    const micR = size * 0.12;
    ctx.beginPath();
    ctx.arc(cx + s * 0.7, cy - s * 0.5, micR, 0, Math.PI * 2);
    ctx.fill();

    // Mic icon lines
    ctx.fillStyle = 'white';
    ctx.fillRect(cx + s * 0.7 - micR * 0.2, cy - s * 0.5 - micR * 0.4, micR * 0.4, micR * 0.6);
    ctx.beginPath();
    ctx.arc(cx + s * 0.7, cy - s * 0.5 - micR * 0.4, micR * 0.2, Math.PI, 0);
    ctx.fill();

    const img = document.createElement('img');
    img.src = canvas.toDataURL('image/png');
    img.style.margin = '10px';
    img.title = 'icon-' + size + '.png';

    const label = document.createElement('div');
    label.textContent = 'icon-' + size + '.png (' + size + 'x' + size + ')';
    label.style.fontFamily = 'sans-serif';

    const div = document.createElement('div');
    div.style.display = 'inline-block';
    div.style.textAlign = 'center';
    div.appendChild(img);
    div.appendChild(label);
    document.body.appendChild(div);
});
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#162542"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Onion rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".55"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".7"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".85"/>
  <!-- Shield silhouette -->
  <path d="M256 110c40 22 90 32 138 32 0 122-40 198-138 252-98-54-138-130-138-252 48 0 98-10 138-32z"
        fill="none" stroke="url(#ring)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Core -->
  <circle cx="256" cy="256" r="50" fill="url(#ring)"/>
  <text x="256" y="272" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif"
        font-weight="800" font-size="42" fill="#ffffff">ST</text>
</svg>

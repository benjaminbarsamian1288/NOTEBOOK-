<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Weltkarte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(16, 16, 40, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        #header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        #controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #controls button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ccc;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        #controls button:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        #search-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }

        #search-box::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #search-box:focus {
            border-color: rgba(100, 149, 237, 0.6);
        }

        #map-container {
            width: 100%;
            height: 100vh;
            padding-top: 56px;
            position: relative;
            overflow: hidden;
        }

        #world-map {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #world-map:active {
            cursor: grabbing;
        }

        #world-map path {
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 0.5;
            transition: fill 0.2s, stroke-width 0.2s;
            cursor: pointer;
        }

        #world-map path:hover {
            stroke: #fff;
            stroke-width: 1.2;
            filter: brightness(1.3);
        }

        #world-map path.highlighted {
            stroke: #ffd700;
            stroke-width: 2;
            filter: brightness(1.5);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { filter: brightness(1.5); }
            50% { filter: brightness(1.8); }
        }

        #tooltip {
            position: fixed;
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 200;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 280px;
        }

        #tooltip .country-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        #tooltip .country-info {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.4;
        }

        #legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(16, 16, 40, 0.9);
            backdrop-filter: blur(10px);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            font-size: 0.78rem;
        }

        #legend h3 {
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .legend-color {
            width: 16px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        #zoom-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(16, 16, 40, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Graticule lines */
        .graticule {
            fill: none;
            stroke: rgba(255, 255, 255, 0.04);
            stroke-width: 0.5;
        }

        .ocean {
            fill: #16213e;
        }
    </style>

    // Ocean background
    const ocean = document.createElementNS(SVG_NS, "rect");
    ocean.setAttribute("x", 0);
    ocean.setAttribute("y", 0);
    ocean.setAttribute("width", mapWidth);
    ocean.setAttribute("height", mapHeight);
    ocean.setAttribute("class", "ocean");
    svg.appendChild(ocean);

    // Graticule (grid) lines
    const graticuleGroup = document.createElementNS(SVG_NS, "g");
    graticuleGroup.setAttribute("class", "graticule");
    // Longitude lines
    for (let lng = -180; lng <= 180; lng += 30) {
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("x1", projectX(lng));
        line.setAttribute("y1", projectY(90));
        line.setAttribute("x2", projectX(lng));
        line.setAttribute("y2", projectY(-90));
        graticuleGroup.appendChild(line);
    }
    // Latitude lines
    for (let lat = -90; lat <= 90; lat += 30) {
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("x1", projectX(-180));
        line.setAttribute("y1", projectY(lat));
        line.setAttribute("x2", projectX(180));
        line.setAttribute("y2", projectY(lat));
        graticuleGroup.appendChild(line);
    }
    svg.appendChild(graticuleGroup);

    // Render country paths
    const countryPaths = {};

    countries.forEach(country => {
        const colors = continentColors[country.continent] || { fill: "#666", hover: "#888" };
        country.paths.forEach((ring, i) => {
            const d = ring.map((pt, idx) => {
                const x = projectX(pt[0]);
                const y = projectY(pt[1]);
                return (idx === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
            }).join(" ") + " Z";

            const path = document.createElementNS(SVG_NS, "path");
            path.setAttribute("d", d);
            path.setAttribute("fill", colors.fill);
            path.setAttribute("data-id", country.id);
            path.setAttribute("data-name", country.nameDE);
            path.setAttribute("data-name-en", country.name);
            path.setAttribute("data-continent", country.continent);

            path.addEventListener("mouseenter", (e) => {
                path.setAttribute("fill", colors.hover);
                showTooltip(e, country);
            });
            path.addEventListener("mousemove", (e) => {
                moveTooltip(e);
            });
            path.addEventListener("mouseleave", () => {
                path.setAttribute("fill", colors.fill);
                hideTooltip();
            });

            svg.appendChild(path);

            if (!countryPaths[country.id]) countryPaths[country.id] = [];
            countryPaths[country.id].push(path);
        });
    });

    // ============================================================
    // Tooltip
    // ============================================================
    function showTooltip(e, country) {
        tooltip.querySelector(".country-name").textContent = country.nameDE;
        tooltip.querySelector(".country-info").innerHTML =
            `<strong>${country.name}</strong><br>` +
            `Kontinent: ${country.continent}<br>` +
            `Hauptstadt: ${country.capital}<br>` +
            `Bevölkerung: ${country.population}`;
        tooltip.style.opacity = 1;
        moveTooltip(e);
    }

    function moveTooltip(e) {
        const offset = 16;
        let x = e.clientX + offset;
        let y = e.clientY + offset;
        // Keep tooltip in viewport
        const rect = tooltip.getBoundingClientRect();
        if (x + 280 > window.innerWidth) x = e.clientX - 280 - offset;
        if (y + 150 > window.innerHeight) y = e.clientY - 150 - offset;
        tooltip.style.left = x + "px";
        tooltip.style.top = y + "px";
    }

    function hideTooltip() {
        tooltip.style.opacity = 0;
    }

    // ============================================================
    // Zoom & Pan
    // ============================================================
    let viewBox = { x: 0, y: 0, w: mapWidth, h: mapHeight };
    let isPanning = false;
    let panStart = { x: 0, y: 0 };

    function updateViewBox() {
        svg.setAttribute("viewBox", `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
    }

    svg.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 1.1 : 0.9;
        const svgRect = svg.getBoundingClientRect();
        const mx = ((e.clientX - svgRect.left) / svgRect.width) * viewBox.w + viewBox.x;
        const my = ((e.clientY - svgRect.top) / svgRect.height) * viewBox.h + viewBox.y;

        const newW = Math.max(200, Math.min(mapWidth * 2, viewBox.w * factor));
        const newH = Math.max(100, Math.min(mapHeight * 2, viewBox.h * factor));

        viewBox.x = mx - (mx - viewBox.x) * (newW / viewBox.w);
        viewBox.y = my - (my - viewBox.y) * (newH / viewBox.h);
        viewBox.w = newW;
        viewBox.h = newH;
        updateViewBox();
    }, { passive: false });

    svg.addEventListener("mousedown", (e) => {
        isPanning = true;
        panStart = { x: e.clientX, y: e.clientY };
    });

    svg.addEventListener("mousemove", (e) => {
        if (!isPanning) return;
        const svgRect = svg.getBoundingClientRect();
        const dx = (e.clientX - panStart.x) / svgRect.width * viewBox.w;
        const dy = (e.clientY - panStart.y) / svgRect.height * viewBox.h;
        viewBox.x -= dx;
        viewBox.y -= dy;
        panStart = { x: e.clientX, y: e.clientY };
        updateViewBox();
    });

    svg.addEventListener("mouseup", () => { isPanning = false; });
    svg.addEventListener("mouseleave", () => { isPanning = false; });

    // Touch support
    let lastTouch = null;
    svg.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
            isPanning = true;
            lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
    }, { passive: true });

    svg.addEventListener("touchmove", (e) => {
        if (!isPanning || !lastTouch) return;
        const touch = e.touches[0];
        const svgRect = svg.getBoundingClientRect();
        const dx = (touch.clientX - lastTouch.x) / svgRect.width * viewBox.w;
        const dy = (touch.clientY - lastTouch.y) / svgRect.height * viewBox.h;
        viewBox.x -= dx;
        viewBox.y -= dy;
        lastTouch = { x: touch.clientX, y: touch.clientY };
        updateViewBox();
    }, { passive: true });

    svg.addEventListener("touchend", () => { isPanning = false; lastTouch = null; });

    function zoomIn() {
        viewBox.x += viewBox.w * 0.1;
        viewBox.y += viewBox.h * 0.1;
        viewBox.w *= 0.8;
        viewBox.h *= 0.8;
        updateViewBox();
    }

    function zoomOut() {
        viewBox.w = Math.min(mapWidth * 2, viewBox.w * 1.25);
        viewBox.h = Math.min(mapHeight * 2, viewBox.h * 1.25);
        viewBox.x -= viewBox.w * 0.1;
        viewBox.y -= viewBox.h * 0.1;
        updateViewBox();
    }

    function resetView() {
        viewBox = { x: 0, y: 0, w: mapWidth, h: mapHeight };
        updateViewBox();
        clearHighlights();
        searchBox.value = "";
    }

    // ============================================================
    // Search
    // ============================================================
    function clearHighlights() {
        svg.querySelectorAll("path.highlighted").forEach(p => p.classList.remove("highlighted"));
    }

    searchBox.addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase().trim();
        clearHighlights();
        if (!query) return;

        countries.forEach(country => {
            const matches = country.nameDE.toLowerCase().includes(query) ||
                            country.name.toLowerCase().includes(query) ||
                            country.id.toLowerCase() === query;
            if (matches && countryPaths[country.id]) {
                countryPaths[country.id].forEach(p => p.classList.add("highlighted"));
            }
        });
    });

    // Focus search box with Ctrl+F / Cmd+F
    document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "f") {
            e.preventDefault();
            searchBox.focus();
        }
        if (e.key === "Escape") {
            searchBox.blur();
            searchBox.value = "";
            clearHighlights();
        }
    });
    </script>
</body>
</html>

name: Deploy App zu GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/build-excel-dual-app-GgnyV
    paths:
      - 'sicherheitstechnik-app/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload App-Ordner
        uses: actions/upload-pages-artifact@v3
        with:
          path: sicherheitstechnik-app

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

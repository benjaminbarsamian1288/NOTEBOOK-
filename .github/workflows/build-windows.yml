name: Build Windows Desktop App

on:
  workflow_dispatch:        # manuell startbar im Actions-Tab
  push:
    branches:
      - claude/build-excel-dual-app-GgnyV
    paths:
      - 'desktop/**'
      - 'sicherheitstechnik-app/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer + portable
        working-directory: desktop
        run: npm run build
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Sicherheitstechnik-Katalog-Windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Auf Releases-Seite veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-app
          name: Sicherheitstechnik-Katalog (Windows)
          body: |
            Fertige Windows-App. Einfach die .exe unten herunterladen und starten.

            - **Sicherheitstechnik-Katalog-portable.exe** – ohne Installation, direkt doppelklicken
            - **...Setup....exe** – Installer mit Desktop- und Startmenü-Icon

            Beim ersten Start zeigt Windows ggf. eine SmartScreen-Warnung:
            „Weitere Informationen" → „Trotzdem ausführen".
          files: desktop/dist/*.exe
          make_latest: true
